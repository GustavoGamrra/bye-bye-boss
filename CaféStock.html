<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>CaféStock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: sidebar + content on desktop; bottom nav with a raised (+) on phones.
   Ground: warm cream. Ink: espresso. Accent: caramel. Status: sage / amber / wine. */
:root{
  --bg:#FBF9F5; --surface:#FFFFFF; --sunken:#F4F0E8; --line:#EBE5DA; --line-2:#DDD5C6;
  --ink:#2C1E18; --ink-2:#5E4C42; --muted:#7D6B60;
  --primary:#2C1E18; --on-primary:#FBF9F5;
  --accent:#A36B3B; --accent-ink:#86522A; --accent-bg:#F6EBDD;
  --ok:#2F7A4D; --ok-ink:#25643F; --ok-bg:#E6F1E9;
  --warn:#C87018; --warn-ink:#8F4D07; --warn-bg:#FBEBD6;
  --crit:#BA2D2D; --crit-ink:#9A2020; --crit-bg:#F8E2E0;
  --c1:#B87B44; --c2:#0B86AB; --c2-ink:#0A6685; --c2-bg:#E1F1F7;
  --shadow:0 1px 2px rgba(44,30,24,.05),0 6px 20px rgba(44,30,24,.04);
  --shadow-pop:0 18px 50px rgba(44,30,24,.22);
  --scrim:rgba(28,18,12,.45);
  --font-display:"Fraunces",Georgia,"Times New Roman",serif;
  --font-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15100D; --surface:#201915; --sunken:#2A211B; --line:#382C24; --line-2:#4B3C31;
  --ink:#F4ECE2; --ink-2:#CDBDAE; --muted:#A39284;
  --primary:#F1E4D3; --on-primary:#2C1E18;
  --accent:#D69A60; --accent-ink:#E4AE78; --accent-bg:#352719;
  --ok:#4FAE76; --ok-ink:#82D2A2; --ok-bg:#1B2E22;
  --warn:#E39A3C; --warn-ink:#F2B96C; --warn-bg:#352510;
  --crit:#E2605E; --crit-ink:#F59A97; --crit-bg:#3B1E1D;
  --c1:#C48444; --c2:#2E9DB8; --c2-ink:#74C8DD; --c2-bg:#16303A;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.25);
  --shadow-pop:0 18px 50px rgba(0,0,0,.6); --scrim:rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15100D; --surface:#201915; --sunken:#2A211B; --line:#382C24; --line-2:#4B3C31;
  --ink:#F4ECE2; --ink-2:#CDBDAE; --muted:#A39284;
  --primary:#F1E4D3; --on-primary:#2C1E18;
  --accent:#D69A60; --accent-ink:#E4AE78; --accent-bg:#352719;
  --ok:#4FAE76; --ok-ink:#82D2A2; --ok-bg:#1B2E22;
  --warn:#E39A3C; --warn-ink:#F2B96C; --warn-bg:#352510;
  --crit:#E2605E; --crit-ink:#F59A97; --crit-bg:#3B1E1D;
  --c1:#C48444; --c2:#2E9DB8; --c2-ink:#74C8DD; --c2-bg:#16303A;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.25);
  --shadow-pop:0 18px 50px rgba(0,0,0,.6); --scrim:rgba(0,0,0,.6);
  color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body.modal-open{overflow:hidden}
[hidden]{display:none!important}
h1,h2,h3,h4,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
.ico{flex:none;display:block}
.muted{color:var(--muted)} .sm{font-size:12.5px} .b{font-weight:700}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}

/* ---------- shell ---------- */
.app{min-height:100vh}
.side{position:fixed;inset:0 auto 0 0;width:252px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:22px;padding:22px 14px 16px;z-index:20}
.brand{display:flex;align-items:center;gap:11px;padding:0 8px}
.logo{width:38px;height:38px;border-radius:12px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center}
.brand-t{display:flex;flex-direction:column;line-height:1.1}
.brand-t b{font-family:var(--font-display);font-weight:600;font-size:21px;letter-spacing:-.01em}
.brand-t b em{font-style:normal;color:var(--accent)}
.brand-t small{font-size:11.5px;color:var(--muted);margin-top:3px}
.snav{display:flex;flex-direction:column;gap:2px}
.snav-i{display:flex;align-items:center;gap:12px;height:42px;padding:0 12px;border-radius:12px;color:var(--ink-2);font-weight:600;font-size:13.5px;position:relative}
.snav-i:hover{background:var(--sunken);color:var(--ink)}
.snav-i.on{background:var(--primary);color:var(--on-primary)}
.cnt{margin-left:auto;font-style:normal;font-size:11px;font-weight:700;min-width:20px;height:20px;padding:0 6px;border-radius:99px;display:grid;place-items:center;background:var(--crit);color:#fff}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.foot-row{display:flex;justify-content:space-between;gap:6px}
.foot-note{font-size:11.5px;color:var(--muted);padding:0 4px;line-height:1.4}
.main{margin-left:252px;padding:30px 36px 110px}
.wrap{max-width:1240px;margin-inline:auto}
.fab{position:fixed;right:28px;bottom:28px;width:56px;height:56px;border-radius:50%;border:0;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;box-shadow:var(--shadow-pop);z-index:30;transition:transform .15s}
.fab:hover{transform:scale(1.06)}
.bnav{display:none}

/* ---------- type & page head ---------- */
.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.phead h1{font-family:var(--font-display);font-weight:500;font-size:clamp(27px,3.4vw,35px);line-height:1.08;letter-spacing:-.015em}
.psub{margin-top:7px;color:var(--ink-2);max-width:62ch}
.pactions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
h3{font-family:var(--font-display);font-weight:500;font-size:18px;letter-spacing:-.005em}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 15px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:600;font-size:13px;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--sunken)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.primary:hover{filter:brightness(1.12)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--sunken)}
.btn.sm{height:30px;padding:0 11px;font-size:12px;border-radius:10px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.icon-btn{width:34px;height:34px;border-radius:10px;border:0;background:transparent;color:var(--ink-2);display:grid;place-items:center}
.icon-btn:hover{background:var(--sunken)}
.input{height:40px;width:100%;min-width:0;border:1px solid var(--line-2);border-radius:12px;background:var(--surface);color:var(--ink);padding:0 12px;font-weight:500}
.input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.input.sel{width:auto;padding-right:6px}
.input.sm{height:34px}
.igroup{display:flex;align-items:stretch;border:1px solid var(--line-2);border-radius:12px;background:var(--surface);overflow:hidden}
.igroup:focus-within{outline:2px solid var(--accent);border-color:var(--accent)}
.igroup .input{border:0;border-radius:0;outline:0}
.igroup .unit{display:grid;place-items:center;padding:0 12px;background:var(--sunken);color:var(--ink-2);font-weight:600;font-size:12.5px;border-left:1px solid var(--line)}
.field{display:grid;gap:6px;min-width:0}
.field>label{font-size:12px;font-weight:700;color:var(--ink-2)}
.hint{font-size:12px;color:var(--muted)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fgrid .full{grid-column:1/-1}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.search{flex:1 1 260px;display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;border:1px solid var(--line-2);border-radius:12px;background:var(--surface);color:var(--muted)}
.search:focus-within{outline:2px solid var(--accent);border-color:var(--accent)}
.search input{border:0;background:transparent;outline:0;flex:1;min-width:0;color:var(--ink);font-weight:500}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{height:32px;padding:0 13px;border-radius:99px;border:1px solid var(--line-2);background:var(--surface);font-weight:600;font-size:12.5px;color:var(--ink-2)}
.chip:hover{background:var(--sunken)}
.chip.on{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.seg{display:inline-flex;padding:3px;background:var(--sunken);border-radius:12px;gap:2px}
.seg button{height:32px;padding:0 13px;border:0;border-radius:9px;background:transparent;font-weight:600;font-size:12.5px;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(44,30,24,.14)}
.seg.sm button{height:28px;padding:0 11px;font-size:12px}
.inline{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:12.5px;color:var(--ink-2)}

/* ---------- badges ---------- */
.badge{display:inline-flex;align-items:center;gap:6px;height:23px;padding:0 10px;border-radius:99px;font-weight:700;font-size:11.5px;line-height:1;white-space:nowrap}
.badge i{width:6px;height:6px;border-radius:50%;background:currentColor}
.b-ok{background:var(--ok-bg);color:var(--ok-ink)}
.b-warn{background:var(--warn-bg);color:var(--warn-ink)}
.b-crit{background:var(--crit-bg);color:var(--crit-ink)}
.b-muted{background:var(--sunken);color:var(--ink-2)}
.b-in{background:var(--c2-bg);color:var(--c2-ink)}
.b-out{background:var(--accent-bg);color:var(--accent-ink)}
.tag{display:inline-block;font-size:11.5px;font-weight:700;color:var(--muted)}
.tag.first{color:var(--accent-ink)}

/* ---------- cards & grids ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:20px;min-width:0}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.card-head .sub{color:var(--muted);font-size:12.5px;margin-top:3px}
.grid{display:grid;gap:16px;margin-bottom:16px}
.g21{grid-template-columns:minmax(0,1.8fr) minmax(0,1fr)}
.g11{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:16px}
.kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 18px 16px;box-shadow:var(--shadow);min-width:0}
.kpi-top{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--ink-2);font-weight:600;font-size:12.5px}
.kpi-ico{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--accent-bg);color:var(--accent-ink);flex:none}
.kpi.crit .kpi-ico{background:var(--crit-bg);color:var(--crit-ink)}
.kpi.warn .kpi-ico{background:var(--warn-bg);color:var(--warn-ink)}
.kpi.ok .kpi-ico{background:var(--ok-bg);color:var(--ok-ink)}
.kpi-val{font-family:var(--font-display);font-weight:500;font-size:clamp(22px,2.4vw,31px);letter-spacing:-.015em;margin:12px 0 4px;line-height:1.1;overflow-wrap:anywhere}
.kpi.crit .kpi-val{color:var(--crit-ink)}
.kpi-sub{color:var(--muted);font-size:12.5px;line-height:1.4}
.delta{font-weight:700}
.delta.bad{color:var(--crit-ink)} .delta.good{color:var(--ok-ink)} .delta.flat{color:var(--ink-2)}
.empty{padding:34px 20px;text-align:center;color:var(--ink-2)}
.empty b{display:block;font-family:var(--font-display);font-weight:500;font-size:18px;color:var(--ink);margin-bottom:4px}
.empty.card{display:block}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin:-4px 0 6px;font-size:12.5px;color:var(--ink-2);font-weight:600}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:12px;height:12px;border-radius:3px}
.k1{background:var(--c1)} .k2{background:var(--c2)}

/* ---------- charts ---------- */
.cc-body{min-width:0}
.cc-body svg{display:block;max-width:100%;overflow:visible}
.gl{stroke:var(--line);stroke-width:1}
.gl.base{stroke:var(--line-2)}
.ax{fill:var(--muted);font:500 11px var(--font-body)}
.ax.b{fill:var(--ink);font-weight:700}
.s1{fill:var(--c1)} .s2{fill:var(--c2)}
.band{outline:none;cursor:default}
.band .hl{fill:var(--sunken);opacity:0;pointer-events:none}
.band:hover .hl,.band:focus .hl{opacity:1}
.band .hit{fill:transparent}
.ln{fill:none;stroke:var(--c1);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.ar{fill:var(--c1);opacity:.1}
.dot{fill:var(--c1);stroke:var(--surface);stroke-width:2}
.hv{opacity:0}
.xh{stroke:var(--line-2);stroke-width:1;opacity:0}
.val{fill:var(--ink);font:700 12px var(--font-body)}
.hbars{display:grid;gap:6px}
.hrow{display:grid;grid-template-columns:minmax(92px,128px) minmax(0,1fr);align-items:center;gap:12px;padding:7px 8px;border-radius:10px;outline:none}
.hrow:hover,.hrow:focus{background:var(--sunken)}
.hl{font-size:12.5px;font-weight:600;color:var(--ink-2);line-height:1.25}
.htrack{display:flex;align-items:center;gap:9px;min-width:0}
.htrack i{flex:none;height:12px;min-width:2px;border-radius:0 4px 4px 0;background:var(--c1)}
.htrack b{font-size:12.5px;font-weight:700;color:var(--ink);white-space:nowrap}
.tscroll{overflow-x:auto}
#tip{position:fixed;z-index:80;left:0;top:0;pointer-events:none;background:var(--surface);border:1px solid var(--line-2);border-radius:12px;box-shadow:var(--shadow-pop);padding:9px 12px;min-width:130px;font-size:12px;opacity:0;transition:opacity .08s}
#tip.on{opacity:1}
.tip-t{color:var(--ink-2);font-weight:600;margin-bottom:5px}
.tip-r{display:flex;align-items:center;gap:8px;margin-top:3px}
.tip-r i{width:12px;height:3px;border-radius:2px}
.tip-r span{color:var(--ink-2);flex:1}
.tip-r strong,.tip-v{color:var(--ink);font-weight:700}
.tip-v{font-size:15px;display:block}

/* ---------- tables ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl td.act{text-align:right;white-space:nowrap}
.tbl td.wrap{white-space:normal;min-width:140px}

/* ---------- lists ---------- */
.rows{display:flex;flex-direction:column}
.lrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);min-width:0}
.lrow:last-child{border-bottom:0;padding-bottom:0}
.lrow:first-child{padding-top:0}
.lrow .mid{flex:1;min-width:0}
.lrow .mid b{display:block;font-weight:700;overflow-wrap:anywhere}
.lrow .mid span{color:var(--muted);font-size:12.5px}
.sdot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--muted)}
.sdot.ok{background:var(--ok)} .sdot.warn{background:var(--warn)} .sdot.crit{background:var(--crit)}
.meter{position:relative;height:6px;border-radius:99px;background:var(--sunken);min-width:60px}
.meter>i{display:block;height:100%;border-radius:99px;background:var(--ok)}
.meter.low>i{background:var(--warn)} .meter.crit>i{background:var(--crit)}
.meter>b{position:absolute;left:50%;top:-3px;width:2px;height:12px;border-radius:2px;background:var(--line-2)}

/* ---------- stock list ---------- */
.slist{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.irow{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);min-width:0}
.irow.open{border-color:var(--line-2)}
.irow-main{display:grid;grid-template-columns:minmax(0,2.1fr) minmax(0,1.3fr) minmax(0,1.7fr) 112px 24px;grid-template-areas:"name qty badges val chev";align-items:center;gap:18px;padding:14px 18px;cursor:pointer;border-radius:16px}
.irow-main:hover{background:color-mix(in srgb,var(--sunken) 55%,transparent)}
.i-name{grid-area:name;min-width:0}
.i-name b{display:block;font-weight:700;overflow-wrap:anywhere}
.i-name span{color:var(--muted);font-size:12.5px}
.i-qty{grid-area:qty;display:grid;gap:6px;min-width:0}
.i-qty .q{font-weight:700;font-variant-numeric:tabular-nums}
.i-qty .q small{font-weight:500;color:var(--muted)}
.i-badges{grid-area:badges;display:flex;gap:6px;flex-wrap:wrap}
.i-val{grid-area:val;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.chev{grid-area:chev;color:var(--muted);transition:transform .15s}
.irow.open .chev{transform:rotate(180deg)}
.irow-lots{border-top:1px solid var(--line);padding:6px 10px 14px}
.lots-foot{display:flex;gap:8px;flex-wrap:wrap;padding:10px 12px 0}

/* ---------- alerts ---------- */
.agrp{margin-bottom:16px}
.agrp-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.agrp-h .sdot{width:12px;height:12px}
.agrp-h .hint{flex-basis:100%;margin-left:24px;margin-top:-6px}
.atot{margin-left:auto;font-weight:700;font-size:13px;color:var(--ink-2)}
.note{display:flex;gap:12px;align-items:flex-start;background:var(--accent-bg);color:var(--accent-ink);border-radius:14px;padding:13px 16px;margin-bottom:16px;font-size:13px;line-height:1.5}
.note b{font-weight:700}

/* ---------- shopping ---------- */
.sup-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.sup-h .grow{flex:1;min-width:200px}
.sup-h .grow b{font-family:var(--font-display);font-weight:500;font-size:18px;display:block}
.crow{display:grid;grid-template-columns:24px minmax(0,1fr) 150px 108px 210px;gap:14px;align-items:center;padding:13px 0;border-top:1px solid var(--line)}
.crow input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.crow .nm b{display:block;font-weight:700}
.crow .nm span{color:var(--muted);font-size:12.5px}
.crow .sub{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.crow.off{opacity:.5}
.totbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.totbar b{font-family:var(--font-display);font-weight:500;font-size:26px;letter-spacing:-.01em}

/* ---------- recipes ---------- */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.rcp{display:flex;flex-direction:column;gap:14px}
.rcp-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.rcp-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--sunken);border-radius:12px;padding:9px 11px;min-width:0}
.stat small{display:block;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.stat b{font-family:var(--font-display);font-weight:500;font-size:18px;font-variant-numeric:tabular-nums}

const pad=n=>String(n).padStart(2,'0');
const toISO=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fromISO=s=>{const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);};
const today0=()=>{const d=new Date();d.setHours(0,0,0,0);return d;};
const addDays=(n,base)=>{const d=new Date(base||today0());d.setDate(d.getDate()+n);return d;};

const fmtD=iso=>{const p=iso.split('-');return p[2]+'/'+p[1];};

/* ============ constants ============ */

/* ============ seed data ============ */
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

function genHistory(itens,seq){
  const R=rng(20261008), out=[];
  const byId=id=>itens.find(i=>i.id===id);
  const pick=a=>a[Math.floor(R()*a.length)];
  const rnd=(a,b)=>a+R()*(b-a);
  const qtyFor=(it,k)=>{
    if(it.un==='kg') return k==='e'?Math.round(rnd(3,10)*2)/2:k==='p'?Math.round(rnd(.3,1.4)*10)/10:Math.round(rnd(.2,1.2)*10)/10;
    if(it.un==='L') return k==='e'?Math.round(rnd(12,36)):k==='p'?Math.round(rnd(1,4)):Math.round(rnd(2,6));
    if(it.un==='un') return k==='e'?Math.round(rnd(24,60)):k==='p'?Math.round(rnd(3,10)):Math.round(rnd(6,24));
    return k==='e'?Math.round(rnd(4,10)):1;
  };
  const push=(dAgo,tipo,it,qtd,motivo,resp)=>{
    const d=addDays(-dAgo);
    d.setHours(7+Math.floor(R()*11),Math.floor(R()*60),0,0);
    let ts=d.getTime(); if(ts>Date.now()) ts=Date.now()-Math.floor(R()*3600000)-60000;
    out.push({id:++seq.mov,ts:ts,tipo:tipo,item:it.id,qtd:qtd,valor:r2(qtd*it.custo),motivo:motivo,resp:resp,lotes:[]});
  };
  const cons=[1,2,3,4,5,6,8,9,10,11,12,13,14,15,16,19];
  for(let d=70;d>=0;d--){
    const wd=addDays(-d).getDay();
    push(d,'producao',byId(1),Math.round(rnd(.5,1.2)*10)/10,'Produção: bebidas do dia',pick(EQUIPE));
    push(d,'producao',byId(3),Math.round(rnd(6,14)),'Produção: bebidas do dia',pick(EQUIPE));

    for(let k=0;k<n;k++){const it=byId(pick(cons));push(d,'saida',it,qtyFor(it,'s'),pick(['Venda no balcão','Venda no balcão','Consumo interno']),pick(EQUIPE));}

  out.sort((a,b)=>b.ts-a.ts);
  return out;
}

function nivel(it){const u=utilizavel(it.id);if(u<=it.min*0.5+1e-9)return 'crit';if(u<it.min-1e-9)return 'low';return 'ok';}
function valStatus(venc){
  if(venc===null||venc===undefined) return {c:'muted',t:'Sem validade',d:null};

  if(d===1) return {c:'warn',t:'Vence amanhã',d:d};
  if(d<=7) return {c:'warn',t:'Vence em '+d+' dias',d:d};
  return {c:'ok',t:'Vence em '+d+' dias',d:d};
}
function plan(itemId,qtd,o){
  o=o||{};
  let ls=lotesDe(itemId);
  if(o.loteId) ls=ls.filter(l=>l.id===o.loteId);
  else if(!o.incluirVencidos) ls=ls.filter(l=>!vencido(l));
  let rest=r3(qtd); const itens=[];
  for(const l of ls){
    if(rest<=0.0004) break;
    const t=r3(Math.min(l.qtd,rest));
    itens.push({lote:l,qtd:t}); rest=r3(rest-t);
  }
  return {itens:itens,falta:rest>0.0004?rest:0};
}
function consume(itemId,qtd,o){
  const p=plan(itemId,qtd,o);
  if(p.falta>0) return null;
  let valor=0; const codes=[];
  p.itens.forEach(e=>{e.lote.qtd=r3(e.lote.qtd-e.qtd);valor+=e.qtd*e.lote.custo;codes.push(e.lote.id);});
  state.lotes=state.lotes.filter(l=>l.qtd>0.0004);
  return {valor:r2(valor),codes:codes};
}

function tipShow(spec,x,y){
  const tip=$('#tip'); if(!tip) return;
  tip.textContent='';
  if(spec.title){const t=document.createElement('div');t.className='tip-t';t.textContent=spec.title;tip.appendChild(t);}
  if(spec.rows&&spec.rows.length){
    spec.rows.forEach(r=>{
      const row=document.createElement('div');row.className='tip-r';
      const k=document.createElement('i');k.className='k'+r[2];
      const l=document.createElement('span');l.textContent=r[0];
      const v=document.createElement('strong');v.textContent=r[1];
      row.appendChild(k);row.appendChild(l);row.appendChild(v);tip.appendChild(row);
    });
  }
  if(spec.val){
    const v=document.createElement('strong');v.className='tip-v';v.textContent=spec.val;tip.appendChild(v);
    if(spec.sub){const s=document.createElement('div');s.className='muted sm';s.textContent=spec.sub;tip.appendChild(s);}
  }
  tip.classList.add('on');
  const w=tip.offsetWidth,h=tip.offsetHeight;
  let left=x+14,top=y-h-12;
  if(left+w>window.innerWidth-8) left=x-w-14;
  if(left<8) left=8;
  if(top<8) top=y+18;
  tip.style.left=left+'px'; tip.style.top=top+'px';
}

/* ============ chart helpers ============ */
function nice(max){
  if(!(max>0)) return {max:4,step:1};
  const raw=max/4, mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const c=[1,2,2.5,5,10];
  let step=10*mag;
  for(const k of c){if(k*mag>=raw-1e-9){step=k*mag;break;}}
  return {max:step*4,step:step};
}
function roundedTop(x,y,w,h,r){
  r=Math.min(r,w/2,h);
  return 'M'+x+','+(y+h)+'V'+(y+r)+'A'+r+','+r+' 0 0 1 '+(x+r)+','+y+'H'+(x+w-r)+'A'+r+','+r+' 0 0 1 '+(x+w)+','+(y+r)+'V'+(y+h)+'Z';
}
function dailySeries(n){
  const map={};
  state.mov.forEach(m=>{
    if(m.tipo==='desperdicio') return;
    const k=toISO(new Date(m.ts));
    const o=map[k]||(map[k]={ent:0,sai:0});
    if(m.tipo==='entrada') o.ent+=m.valor; else o.sai+=m.valor;
  });
  return Array.from({length:n},(_,i)=>{
    const d=addDays(-(n-1-i)),k=toISO(d),v=map[k]||{ent:0,sai:0};
    return {iso:k,d:d,ent:r2(v.ent),sai:r2(v.sai)};
  });
}
function catSeries(){
  return CATS.map(c=>{
    const ids=state.itens.filter(i=>i.cat===c.id).map(i=>i.id);
    const v=state.lotes.filter(l=>ids.indexOf(l.item)>=0).reduce((s,l)=>s+l.qtd*l.custo,0);
    return {c:c,v:v,n:ids.length};
  }).sort((a,b)=>b.v-a.v);
}
function weekly(){
  const out=[];
  for(let i=0;i<8;i++){
    const endOff=-(7*(7-i)),startOff=endOff-6;
    const a=addDays(startOff).getTime(),b=addDays(endOff+1).getTime();
    const v=sumPerdas(a,b);
    const sd=toISO(addDays(startOff)),ed=toISO(addDays(endOff));
    out.push({label:fmtD(sd),tt:fmtD(sd)+' a '+fmtD(ed),v:r2(v)});
  }
  return out;
}
function pRangeInfo(){
  const r=ui.pRange,now=new Date();

  if(r==='mes'){
    a=new Date(now.getFullYear(),now.getMonth(),1);b=addDays(1);

const perdasIn=(a,b)=>state.mov.filter(m=>m.tipo==='desperdicio'&&m.ts>=a&&m.ts<b);
function motivoSeries(){

function drawLine(el,pts,serie){

  });

    const r=svg.getBoundingClientRect(),px=(cx-r.left)*(W/(r.width||W));
    let best=0,bd=1e9;
    for(let i=0;i<n;i++){const d=Math.abs(X(i)-px);if(d<bd){bd=d;best=i;}}
    return best;
  };
  svg.addEventListener('pointermove',e=>{

function deltaHTML(cur,prev,label,upBad){
  if(!(prev>0)) return '<span class="muted">Sem base de comparação em '+esc(label)+'</span>';
  const p=(cur-prev)/prev*100;
  if(Math.abs(p)<0.5) return '<span class="delta flat">Estável</span> vs. '+esc(label);
  const up=p>0,bad=upBad?up:!up;
  return '<span class="delta '+(bad?'bad':'good')+'">'+(up?'▲ +':'▼ −')+nf0.format(Math.abs(p))+'%</span> vs. '+esc(label);
}

/* ---- compras ---- */
function comprasData(){
  const rows=[];
  state.itens.forEach(it=>{
    const u=utilizavel(it.id);
    if(u>=it.min-1e-9) return;
    const step={kg:.5,L:1,un:6,pct:1}[it.un]||1;
    const need=Math.max(0,it.min*ui.alvo-u);
    const sug=Math.max(step,Math.ceil(need/step-1e-9)*step);
    const qtd=ui.cqtd[it.id]!=null?ui.cqtd[it.id]:sug;
    const f=getForn(it.forn),cov=coverage(it);
    rows.push({it:it,u:u,sug:sug,qtd:qtd,f:f,cov:cov,nv:nivel(it)});
  });
  const rank={crit:0,low:1,ok:2};
  rows.sort((a,b)=>rank[a.nv]-rank[b.nv]||a.it.nome.localeCompare(b.it.nome,'pt-BR'));
  return rows;
}
function orderText(g){
  const sel=g.rows.filter(r=>!ui.coff.has(r.it.id));
  const tot=sel.reduce((s,r)=>s+r.qtd*r.it.custo,0);
  return 'Pedido para '+g.f.nome+'\n'+sel.map(r=>'- '+r.it.nome+': '+fmtQty(r.qtd,r.it.un)).join('\n')+'\nTotal estimado: '+money(tot)+'\nEntrega desejada em até '+g.f.prazo+(g.f.prazo===1?' dia':' dias');
}

/* ---- fichas técnicas ---- */
function recStats(r){
  const cpv=custoReceita(r),pct=r.preco>0?cpv/r.preco*100:0;
  let por=Infinity;
  r.ing.forEach(g=>{const it=getItem(g[0]);if(!it)return;const need=g[1]/it.fator;por=Math.min(por,Math.floor(utilizavel(it.id)/need+1e-9));});
  return {cpv:cpv,pct:pct,margem:r.preco-cpv,por:isFinite(por)?por:0};
}
VIEWS.fichas=function(){
  ui.charts=[];
  const st=state.receitas.map(r=>({r:r,s:recStats(r)}));
  const avg=st.length?st.reduce((a,x)=>a+x.s.pct,0)/st.length:0;
  const best=st.slice().sort((a,b)=>b.s.margem-a.s.margem)[0];
  const head=pageHead('Fichas técnicas','O custo (CPV) soma a porção de cada ingrediente pelo último custo de compra do estoque.','<button class="btn primary" data-act="nova-ficha">'+ico('plus',16)+'Nova ficha</button>');
  const kp='<section class="kpis k3">'+
    kpi('Fichas cadastradas',String(st.length),'Cada ficha usa ingredientes do estoque','book','')+
    kpi('CPV médio',nf1.format(avg)+'%',avg<=30?'Dentro da meta de 30%':'Acima da meta de 30% para a média','coin',avg<=30?'ok':'warn')+
    kpi('Maior margem em R$',best?esc(best.r.nome):'—',best?money(best.s.margem)+' por unidade vendida':'','check','ok')+'</section>';
  const cards=st.map(x=>{
    const r=x.r,s=x.s,tone=s.pct<=30?'ok':s.pct<=40?'warn':'crit';
    return '<article class="card rcp"><div class="rcp-h"><div><h3>'+esc(r.nome)+'</h3><span class="muted sm">Rende 1 porção</span></div>'+badge(tone,'CPV '+nf1.format(s.pct)+'%')+'</div>'+
    '<div class="rcp-stats"><div class="stat"><small>Custo</small><b>'+money(s.cpv)+'</b></div><div class="stat"><small>Preço</small><input class="input" type="number" min="0" step="0.5" inputmode="decimal" id="pr-'+r.id+'" value="'+r.preco+'" data-in="preco" data-id="'+r.id+'" aria-label="Preço de venda de '+esc(r.nome)+'"></div><div class="stat"><small>Margem</small><b>'+money(s.margem)+'</b></div></div>'+
    '<div class="ing">'+r.ing.map(g=>{
      const it=getItem(g[0]);if(!it)return '';
      const ok=utilizavel(it.id)>=g[1]/it.fator-1e-9;
      return '<div><span class="sdot '+(ok?'ok':'crit')+'" title="'+(ok?'Em estoque':'Sem estoque para 1 porção')+'"></span><span>'+esc(it.nome)+'</span><em>'+nf1.format(g[1])+' '+ingUnit(it)+'</em><b>'+money(it.custo*g[1]/it.fator)+'</b></div>';
    }).join('')+'</div>'+
    '<div class="rcp-f"><span class="muted sm">'+(s.por>0?'Dá para produzir ~'+nf0.format(s.por)+' porções':'Sem estoque para produzir')+'</span><button class="btn sm primary" data-act="mov" data-tipo="producao" data-rec="'+r.id+'">'+ico('producao',14)+'Produzir</button></div></article>';
  }).join('');
  return head+kp+'<section class="rgrid">'+cards+'</section>';
};

      '<div class="field"><label for="mv-forn">Fornecedor</label><select id="mv-forn" class="input" data-m="forn">'+state.fornecedores.map(f=>'<option value="'+f.id+'"'+(f.id===forn?' selected':'')+'>'+esc(f.nome)+'</option>').join('')+'</select></div>'+
      '<div class="field"><label for="mv-nf">Nota fiscal (opcional)</label><input id="mv-nf" class="input" type="text" maxlength="40" value="'+esc(mv.nf)+'" data-m="nf" placeholder="Ex.: NF 18452"></div>';
  }else{
    const motivos=t==='saida'?MOTIVOS_SAIDA:MOTIVOS_PERDA;
    const mot=(mv.motivo&&motivos.indexOf(mv.motivo)>=0)?mv.motivo:motivos[0];
    mv.motivo=mot;
    const ls=it?lotesDe(it.id).filter(l=>t==='desperdicio'||!vencido(l)):[];
    if(mv.lote!=='auto'&&!ls.some(l=>l.id===mv.lote)) mv.lote='auto';
    h+='<div class="field"><label for="mv-motivo">Motivo</label><select id="mv-motivo" class="input" data-m="motivo">'+motivos.map(m=>'<option'+(m===mot?' selected':'')+'>'+m+'</option>').join('')+'</select></div>'+
      '<div class="field full"><label for="mv-lote">Lote</label><select id="mv-lote" class="input" data-m="lote"><option value="auto"'+(mv.lote==='auto'?' selected':'')+'>Automático, pela regra FEFO</option>'+
      ls.map(l=>'<option value="'+l.id+'"'+(mv.lote===l.id?' selected':'')+'>'+l.id+' · '+(l.venc?'vence '+fmtD(l.venc):'sem validade')+(vencido(l)?' (vencido)':'')+' · '+fmtQty(l.qtd,it.un)+'</option>').join('')+'</select></div>';
  }
  return h+respField()+'</div>';
}
function movInput(name,el){
  const mv=ui.mv; if(!mv) return;
  if(name==='item'){mv.item=+el.value;mv.lote='auto';mv.custo=null;mv.forn=null;mv.sem=null;rerenderMov('mv-item');return;}
  if(name==='rec'){mv.rec=+el.value;movRefresh();return;}
  if(name==='sem'){mv.sem=el.checked;const v=$('#mv-val');if(v)v.disabled=el.checked;movRefresh();return;}
  mv[name]=el.value;
  movRefresh();
}
function rerenderMov(focusId){
  const f=$('#mv-form'); if(!f) return;
  f.innerHTML=movFields()+'<div id="mv-preview" class="preview" aria-live="polite"></div>';
  movRefresh();
  const e=$('#'+focusId); if(e) e.focus();
}
function movRefresh(){
  const r=movCheck(),pv=$('#mv-preview'),ok=$('#mv-ok');
  if(!pv||!ok) return;
  pv.innerHTML=r.html; ok.disabled=!r.ok;
}
function afterNivel(it,after){return after<=it.min*0.5+1e-9?'crit':after<it.min-1e-9?'low':'ok';}
function movCheck(){
  const mv=ui.mv,t=mv.tipo;
  const err=m=>({ok:false,html:'<div class="pv-err">'+ico('alert',16)+'<span>'+m+'</span></div>',exec:null});
  const blank={ok:false,html:'',exec:null};
  if(t==='producao'){
    const r=getRec(mv.rec); if(!r) return blank;
    if(mv.por==='') return blank;
    const por=parseNum(mv.por);
    if(!(por>=1)||!Number.isInteger(por)) return err('Informe um número inteiro de porções.');
    let ok=true;const rows=[];
    r.ing.forEach(g=>{
      const it=getItem(g[0]); if(!it) return;
      const need=r3(g[1]*por/it.fator),u=utilizavel(it.id),good=u>=need-1e-9;
      if(!good) ok=false;
      rows.push({it:it,need:need,u:u,good:good});
    });
    const custo=custoReceita(r)*por;
    const html='<div class="pv-t">Insumos baixados pela regra FEFO</div>'+rows.map(x=>'<div class="pv-r"><span>'+esc(x.it.nome)+'</span><b'+(x.good?'':' class="pv-err"')+'>'+fmtQty(x.need,x.it.un)+' de '+fmtQty(x.u,x.it.un)+(x.good?'':' · insuficiente')+'</b></div>').join('')+
      '<div class="pv-r"><span>Custo da produção (CPV)</span><b>'+money(custo)+'</b></div>'+(ok?'':'<div class="pv-err">'+ico('alert',16)+'<span>Faltam insumos para essa quantidade. Reduza as porções ou registre uma entrada.</span></div>');
    return {ok:ok,html:html,exec(){
      const ids=[];
      rows.forEach(x=>{const res=consume(x.it.id,x.need);addMov({tipo:'producao',item:x.it.id,qtd:x.need,valor:res.valor,motivo:por+'× '+r.nome,resp:mv.resp,lotes:res.codes});ids.push(x.it.id);});
      return {msg:'Produção registrada: '+por+'× '+r.nome+' · custo '+money(custo),ids:ids};
    }};
  }
  const it=getItem(mv.item); if(!it) return blank;
  if(mv.qtd==='') return blank;
  const q=parseNum(mv.qtd);
  if(!(q>0)) return err('Informe uma quantidade maior que zero.');
  if(t!=='entrada'&&it.un!=='kg'&&it.un!=='L'&&!Number.isInteger(q)) return err('Para '+esc(it.un)+', informe um número inteiro.');
  if(t==='entrada'){
    const custo=parseNum(mv.custo!=null?mv.custo:it.custo);
    const sem=mv.sem!=null?mv.sem:(it.cat==='embal'||it.cat==='limpeza');
    if(!(custo>=0)) return err('Informe o custo por '+esc(it.un)+'.');
    if(!sem){
      if(!mv.val) return err('Informe a validade do lote ou marque “Produto sem validade”.');
      if(mv.val<isoPlus(0)) return err('A validade não pode ser anterior a hoje.');
    }
    const forn=mv.forn!=null?+mv.forn:it.forn;
    const html='<div class="pv-t">Novo lote</div><div class="pv-r"><span>Código do lote</span><b>L-'+(state.seq.lote+1)+'</b></div><div class="pv-r"><span>Valor da entrada</span><b>'+money(q*custo)+'</b></div>'+
      '<div class="pv-r"><span>Validade</span><b>'+(sem?'Sem validade':fmtDY(mv.val)+' · '+valStatus(mv.val).t.toLowerCase())+'</b></div><div class="pv-r"><span>Saldo após a entrada</span><b>'+fmtQty(r3(utilizavel(it.id)+q),it.un)+'</b></div>';
    return {ok:true,html:html,exec(){
      const l=doEntrada({item:it.id,qtd:q,custo:custo,venc:sem?null:mv.val,forn:forn,nf:(mv.nf||'').trim(),resp:mv.resp});
      return {msg:'Entrada registrada: '+fmtQty(q,it.un)+' de '+it.nome+' · lote '+l.id,ids:[]};
    }};
  }
  const loteId=mv.lote==='auto'?null:mv.lote,incl=t==='desperdicio';
  const p=plan(it.id,q,{loteId:loteId,incluirVencidos:incl});
  if(p.falta>0){
    let m='Quantidade acima do disponível'+(loteId?' neste lote':'')+': '+fmtQty(r3(q-p.falta),it.un)+'.';
    if(!loteId&&t==='saida'&&estoque(it.id)>utilizavel(it.id)) m+=' Lotes vencidos não podem sair; descarte-os primeiro.';
    return err(m);
  }
  const valor=p.itens.reduce((s,e)=>s+e.qtd*e.lote.custo,0);
  const usedUsable=p.itens.filter(e=>!vencido(e.lote)).reduce((s,e)=>s+e.qtd,0);
  const after=r3(utilizavel(it.id)-usedUsable),nv=afterNivel(it,after);
  const html='<div class="pv-t">'+(loteId?'Será baixado deste lote':'Baixa pela regra FEFO')+'</div>'+
    p.itens.map(e=>'<div class="pv-r"><span>'+e.lote.id+' · '+(e.lote.venc?'vence '+fmtD(e.lote.venc):'sem validade')+(vencido(e.lote)?' (vencido)':'')+'</span><b>'+fmtQty(e.qtd,it.un)+'</b></div>').join('')+
    '<div class="pv-r"><span>'+(t==='saida'?'Custo da saída':'Valor da perda')+'</span><b>'+money(valor)+'</b></div>'+
    '<div class="pv-r"><span>Saldo após a operação</span><b>'+fmtQty(after,it.un)+' '+badge(NIV[nv].c,NIV[nv].t)+'</b></div>';
  return {ok:true,html:html,exec(){
    const res=consume(it.id,q,{loteId:loteId,incluirVencidos:incl});
    addMov({tipo:t,item:it.id,qtd:q,valor:res.valor,motivo:mv.motivo,resp:mv.resp,lotes:res.codes});
    const lt=res.codes.length?' · lote '+res.codes[0]+(res.codes.length>1?' e mais '+(res.codes.length-1):''):'';
    return {msg:t==='saida'?'Saída registrada: '+fmtQty(q,it.un)+' de '+it.nome+lt:'Perda registrada: '+money(res.valor)+' em '+it.nome,ids:[it.id]};
  }};
}
function movConfirm(){
  const r=movCheck(); if(!r.ok||!r.exec) return;
  const out=r.exec();
  save(); closeModal(true); render();
  toast(out.msg,out.msg.indexOf('Perda')===0?'warn':'ok');
  (out.ids||[]).forEach(id=>{const it=getItem(id);if(it&&nivel(it)==='crit')setTimeout(()=>toast(it.nome+' está em nível crítico. Veja a lista de compras.','warn'),700);});

    const id=el.dataset.id,v=el.dataset.v;
    ui.cview[id]=v;
    $$('[data-act="cview"][data-id="'+id+'"]').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
    drawChart(id);
  },
  theme(){
    const t=isDark()?'light':'dark';
    document.documentElement.setAttribute('data-theme',t); lsSet(THEME_KEY,t); updateThemeBtn();
  },
  reset(){
    if(!ui.armReset){
      ui.armReset=true;
      toast('Toque de novo para restaurar os dados de exemplo. Suas alterações serão apagadas.','warn');
      setTimeout(()=>{ui.armReset=false;},5000);
      return;
    }
    ui.armReset=false; state=seed(); ui.open=new Set(); ui.cqtd={}; ui.coff=new Set();
    save(); closeModal(true); render(); toast('Dados de exemplo restaurados','ok');
  },
  more(){openMore();},
  descartar(el){
    const l=state.lotes.find(x=>x.id===el.dataset.lote); if(!l) return;
    const it=getItem(l.item),id=l.id,v=discardLote(id);
    save(); render(); toast('Lote '+id+' descartado · perda de '+money(v)+' em '+it.nome,'warn');
  },
  'descartar-todos'(el){
    const exp=state.lotes.filter(vencido);
    if(!exp.length) return;
    const v=exp.reduce((s,l)=>s+l.qtd*l.custo,0);
    if(!ui.armDescartar){
      ui.armDescartar=true;
      el.textContent='Confirmar descarte de '+exp.length+(exp.length>1?' lotes':' lote')+' ('+money(v)+')';
      el.classList.add('primary');
      setTimeout(()=>{if(ui.armDescartar){ui.armDescartar=false;if(ui.route==='alertas')render();}},5000);
      return;
    }
    ui.armDescartar=false;
    exp.forEach(l=>discardLote(l.id));
    save(); render(); toast(exp.length+(exp.length>1?' lotes descartados':' lote descartado')+' · perda de '+money(v)+' registrada','warn');
  },
  'copy-pedido'(el){
    const fid=+el.dataset.id;
    const rows=comprasData().filter(r=>r.f.id===fid);
    copyText(orderText({f:getForn(fid),rows:rows}),'Pedido copiado');
  },
  receber(el){openMov({tipo:'entrada',item:+el.dataset.item,qtd:el.dataset.qtd});},
  tab(el){ui.hTab=el.dataset.v;render();},
  'novo-item'(){openItem();},
  'ni-save'(){saveItem();},
  'nova-ficha'(){openFicha();},
  'rf-add'(){ui.rf.ing.push({item:state.itens[0].id,qtd:''});rfRows();},
  'rf-del'(el){if(ui.rf.ing.length>1){ui.rf.ing.splice(+el.dataset.i,1);rfRows();}},
  'rf-save'(){saveFicha();},
  'forn-novo'(){openForn();},
  'forn-edit'(el){openForn(+el.dataset.id);},
  'fn-save'(){saveForn();},
  'copy-text'(el){copyText(el.dataset.text,'Copiado');},
  'p-range'(el){ui.pRange=el.dataset.v;render();},
  'h-tipo'(el){
    ui.hTipo=el.dataset.v; ui.hN=40;
    $$('#h-chips .chip').forEach(c=>c.classList.toggle('on',c.dataset.v===ui.hTipo));
    renderHist();
  },
  'h-mais'(){ui.hN+=40;renderHist();}
};
const IN={
  q(el){ui.q=el.value;renderStockList();},
  nv(el){ui.nv=el.value;renderStockList();},
  hq(el){ui.hQ=el.value;ui.hN=40;renderHist();},
  hd(el){ui.hDias=+el.value;ui.hN=40;renderHist();},
  alvo(el,e){if(e.type!=='change')return;ui.alvo=+el.value;ui.cqtd={};render();},
  cqty(el,e){
    if(e.type!=='change') return;
    const v=parseNum(el.value);
    if(v>=0) ui.cqtd[el.dataset.id]=v;
    render();
  },
  csel(el,e){
    if(e.type!=='change') return;
    const id=+el.dataset.id;
    if(el.checked) ui.coff.delete(id); else ui.coff.add(id);
    render();
  },
  preco(el,e){
    if(e.type!=='change') return;
    const r=getRec(+el.dataset.id),v=parseNum(el.value);
    if(r&&v>0){r.preco=r2(v);save();render();toast('Preço atualizado: '+r.nome+' por '+money(r.preco),'ok');}
    else render();
  }
};

/* ============ global events ============ */
document.addEventListener('click',e=>{
  const el=e.target.closest&&e.target.closest('[data-act]'); if(!el) return;
  const fn=ACT[el.dataset.act]; if(!fn) return;
  if(el.tagName==='A') e.preventDefault();
  fn(el,e);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&ui.modal){closeModal();return;}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[role="button"][data-act]')){e.preventDefault();e.target.click();}
});
['input','change'].forEach(type=>document.addEventListener(type,e=>{
  const el=e.target; if(!el||!el.dataset) return;
  if(el.dataset.m){
    if(type==='change'||!ui.modal) return;
    ui.modal.onInput(el.dataset.m,el,e);
    return;
  }
  if(el.dataset.in&&IN[el.dataset.in]) IN[el.dataset.in](el,e);
}));
document.addEventListener('pointermove',e=>{
  const t=e.target; if(!t||!t.closest) return;
  if(t.closest('[data-tipzone]')) return;
  const el=t.closest('[data-tt]');
  if(el) tipFromEl(el,e.clientX,e.clientY); else tipHide();
});
document.addEventListener('focusin',e=>{
  const el=e.target.closest&&e.target.closest('[data-tt]');
  if(el){const r=el.getBoundingClientRect();tipFromEl(el,r.left+r.width/2,r.top);}
});
document.addEventListener('focusout',tipHide);
document.addEventListener('scroll',tipHide,true);
let rt;
window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>ui.charts.forEach(drawChart),140);});
window.addEventListener('hashchange',()=>{
  const r=(location.hash||'').slice(1);
  if(r&&VIEWS[r]&&r!==ui.route){ui.route=r;render();window.scrollTo(0,0);}
});

/* ============ init ============ */
(function init(){
  const st=lsGet(THEME_KEY);
  if(st==='dark'||st==='light') document.documentElement.setAttribute('data-theme',st);
  $('#side-mov').innerHTML=ico('plus',16)+'Movimentar estoque';
  $('#fab').innerHTML=ico('plus',26);
  updateThemeBtn();
  const h=(location.hash||'').slice(1);
  if(VIEWS[h]) ui.route=h;
  render();
  save();
})();
})();
</script>

</body></html>
